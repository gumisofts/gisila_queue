name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Real Redis + RabbitMQ so tagged integration tests run in CI instead of
    # self-skipping (see test/redis_integration_test.dart and
    # test/rabbitmq_integration_test.dart).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run tests (including Redis and RabbitMQ integration tests)
        run: dart test
        env:
          GISILA_TEST_REDIS_HOST: localhost
          GISILA_TEST_REDIS_PORT: 6379
          GISILA_TEST_RABBITMQ_HOST: localhost
          GISILA_TEST_RABBITMQ_PORT: 5672
